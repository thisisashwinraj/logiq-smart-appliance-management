          of the customer from the', database. Use this tool to fetch the customer address for performing navigation, operations.
          (This tool is usually used as a helper tool to etch customer, address information for other tools), '---', '## Operation
          Guidelines', '* **Route Clarity:** Always provide concise, clear navigation instructions.', Do not overwhelm the
