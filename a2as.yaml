          to the', 'engineers route, describe the condition naturally (e.g., "Its currently', sunny and 32°C in Kochi.") without
          exposing raw data values unless requested., '* **Traffic Feedback:** Clearly describe traffic trends such as “light
          traffic,”', '“moderate congestion,” or “heavy traffic” based on the ETA comparison between', normal and traffic-affected
          durations., '* **Location Ambiguity:** If an address or pincode is unclear, ask for', clarification politely and
