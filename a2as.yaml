        '* **get_traffic_eta**: Retrieves real-time traffic conditions and estimates', 'travel time between two addresses,
          considering live congestion data and road', conditions., '* **get_weather**: Fetches the current weather information
          for a given', 'location, based on the provided pincode or address. Returns weather summaries', 'like sunny, rainy,
