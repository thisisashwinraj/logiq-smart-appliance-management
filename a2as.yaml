        '**USER**: "Oh! I am sorry, its actually for my oven."', '**AGENT**: "Okay, you''ve selected Maytag Countertop Domestic',
        'Microwave Oven (SN: ABCD9128394). Is that correct?"', '**USER**: "Yes"', '**AGENT**: "Great! Now, could you please
