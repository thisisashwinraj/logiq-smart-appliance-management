  get_resolution_history:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to fetch the resolution history of all resolved service requests for a \nspecific appliance.\n\n\
        For each resolved service request, the tool extracts and returns relevant\nresolution details such as:\n- request\
        \ ID\n- request title\n- problem description\n- resolution details (excluding OTPs and feedback)\n- created date\n\
        \nArgs:\n    customer_id (str): The unique identifier of the customer whose service \n        history is to be fetched.\n\
        \    serial_number (str): The serial number of the appliance for which the \n        resolution history is required.\n\
        \nReturns:\n    dict: A dictionary containing:\n        - status (str): Indicates the operation result \n        \
        \    - (\"success\", \"not_found\", or \"error\").\n\n        On success:\n        If found. Each ticket contains:\n\
        \        - resolution_history (dict, optional): A dictionary containing the \n            request and resolution details.\
        \ Each key is a request ID.\n            - request_id (str): The ticket ID.\n            - request_title (str): Title\
        \ of the service request.\n            - problem_description (str): Description of the issue.\n            - resolution_details\
        \ (dict): Details of the resolution provided.\n            - created_on (str): Timestamp when the ticket was created.\n\
        \        \n        If not found:\n        - message (str): Message indicating \n\n        On error:\n        - message\
        \ (str): Error message if the operation fails.\n\nExample:\n    >>> get_resolution_history(\"CUST12345\", \"SN987654321\"\
        )\n    >>> Tool Response:\n    {\n        \"205771230020\": {\n            \"end_date\": \"2025-02-24 19:13:59\",\n\
        \            \"additional_notes\": \"...\",\n            \"start_date\": \"2025-02-24 18:45:41\",\n            \"\
        action_performed\": \"...\",\n            \"request_id\": \"205771230020\",\n            \"request_title\": \"Microwave\
        \ oven not heating\",\n            \"description\": \"My microwave is not heating food...\",\n            \"created_on\"\
        : \"2024-12-10 22:54:11\"\n        }\n    }"
  get_resolution_notes:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to retrieve resolution notes for all resolved service requests for a \nspecific appliance owned by\
        \ a customer.\n\nThis tool searches the customer's service request records and for each\nresolved service request,\
        \ it collects relevant resolution details such as \nthe issue description, request title, and resolution summary.\n\
        \nArgs:\n    customer_id (str): The unique identifier of the customer whose \n        service resolution history is\
        \ to be fetched.\n    serial_number (str): The serial number of the appliance for which \n        past resolution\
        \ notes are required.\n\nReturns:\n    dict: A dictionary containing:\n        - status (str): Indicates the operation\
        \ result \n            - (\"success\", \"not_found\", or \"error\").\n        \n        On success:\n        - resolution_history:\
        \ Dictionary mapping each service request ID to \n            its corresponding resolution details.\n\n        If\
        \ not found or on error:\n        - message: A descriptive message explaining the outcome or error.\n\nExample:\n\
        \    >>> get_resolution_notes(\"CUST1023\", \"SN0987654321\")\n    >>> Tool Respone:\n    {\n        \"status\": \"\
        success\",\n        \"resolution_history\": {\n            \"12349876546\": {\n                \"request_title\":\
        \ \"Microwave oven not heating\",\n                \"description\": \"Microwave fails to heat food ...\",\n      \
        \          \"created_on\": \"2024-12-10 22:54:11\",\n                \"action_performed\": \"Replaced faulty magnetron\
        \ ...\",\n                \"end_date\": \"2025-02-24 19:13:59\",\n                \"additional_notes\": \"Advised\
        \ customer to avoid running ...\"\n            },\n            ...\n        }\n    }"
  get_service_request_details_tool:
    type: function
    agents: [service_requests_agent]
    params:
      description: |-
        Retrieves comprehensive details for a specific service request.

        This tool fetches all available information for a given service request
        associated with a particular customer.

        Args:
            customer_id (str): Unique identifier of the customer.
            request_id (str): Unique ID of the request to retrieve details for.

        Returns:
            Dict[str, Any]: A dictionary containing all details of the service
            request if found. Returns an empty dictionary ({}) if the request is
            not found for the given customer.
                            - Returns a dictionary with 'status': 'error' and a
                              'message' on an error during retrieval.
  get_sub_categories_tool:
    type: function
    agents: [product_enquiry_agent, register_appliance_agent]
    params:
      description: |-
        Retrieves a list of valid sub-categories for a given appliance category
