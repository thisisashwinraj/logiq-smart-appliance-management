                  for 'Refrigerator'.
  get_ticket_details:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to fetch detailed information about a specific active service ticket.\n\nThis tool connects to Firestore\
        \ and retrieves the details of a service \nrequest ticket identified by the `ticket_id`. It returns comprehensive\
        \ \ninformation about the ticket if found.\n\nArgs:\n    customer_id (str): The unique identifier of the customer.\n\
        \    ticket_id (str): The unique identifier of the service ticket.\n\nReturns:\n    Dict[str, Any]: A dictionary containing\
        \ the status of the request and \n        the ticket details if found.\n\nExample:\n    >>> get_ticket_details(\"\
        CUST1023\", \"REQ8901\")\n    >>> Tool Respone:\n    {\n        \"status\": \"success\",\n        \"ticket_details\"\
        : {\n            \"request_title\": \"Refrigerator not cooling properly\",\n            \"description\": \"The refrigerator\
        \ is running but not maintaining temperature.\",\n            \"ticket_status\": \"active\",\n            \"appliance_details\"\
        : {\n                \"serial_number\": \"RF1023AB45\",\n                \"model\": \"Whirlpool FrostFree 300L\"\n\
        \            },\n            \"created_on\": \"2024-12-10 22:54:11\",\n            \"assigned_to\": \"ENGR204\"\n\
        \        }\n    }"
  get_traffic_eta:
    type: function
    agents: [navigation_agent]
    params:
      description: "Tool to retrieve real-time traffic information and estimated travel time \nbetween two addresses.\n\n\
        This tool sends a request to the Google Maps Directions API to calculate\nthe distance, typical travel duration, and\
        \ the estimated duration \nconsidering current traffic conditions.\n\nArgs:\n    origin (str): Starting address or\
        \ location of the user.\n        - e.g., \"Kochi, Kerala\"\n    destination (str): Destination address or location\
        \ of the user.\n        - e.g., \"Thrissur, Kerala\"\n\nReturns:\n    dict: A dictionary containing:\n        - status\
        \ (str): Indicates the operation result \n            - \"success\", \"not_found\", or \"error\".\n\n        On success:\n\
        \        A dictionary containing:\n            - origin (str): Formatted starting address.\n            - destination\
        \ (str): Formatted destination address.\n            - distance (str): Human-readable distance (e.g., \"10 km\").\n\
        \            - duration (str): Human-readable duration (e.g., \"30 mins\").\n            - duration_in_traffic (str):\
        \ Duration in traffic (e.g., \"45 \n              mins\").\n\n        On error:\n        - error (str): Error code\
        \ from the API.\n        - details (str): Additional error details if available."
  get_troubleshooting_help:
    type: function
    agents: [troubleshoot_agent]
    params:
      description: "Tool to retrieve troubleshooting guidance for a given query using Gemini's \nFile Search powered Retrieval-Augmented\
        \ Generation (RAG).\n\nThis tool retrieves the active file search store containing appliance \nmanuals and technical\
        \ documents to provide context-aware troubleshooting \nassistance.\n\nArgs:\n    query (str): The user's troubleshooting\
        \ question, symptom description, \n        error code, or repair-related query.\n\nReturns:\n    dict: A response\
        \ object with the following structure:\n        - \"status\": \"success\" or \"error\".\n        - \"response\": The\
        \ generated troubleshooting guidance \n          (present only on success).\n        - \"message\": Error details\
        \ (present only on error)."
  get_weather:
    type: function
    agents: [navigation_agent]
  list_active_tickets:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to fetch all active service tickets assigned to a specific engineer.\n\nThis tool connects to Firestore,\
        \ iterates through all service requests and \nretrieves tickets where the `assigned_to` field matches the given \n\
        `engineer_id`. Only unresolved active tickets are included in the result.\n\nArgs:\n    engineer_id (str): The unique\
        \ identifier of the service engineer.\n\nReturns:\n    dict: A dictionary containing:\n        - status (str): Indicates\
        \ the operation result \n            - (\"success\", \"not_found\", or \"error\").\n\n        On success:\n      \
        \  If found. Each ticket contains:\n            - active_tickets (list[dict], optional): List of active tickets.\n\
        \                - request_id (str): The ticket ID.\n                - title (str): Title of the service request.\n\
        \                - description (str): Description of the issue or request.\n                - created_on (str): Timestamp\
        \ when the ticket was created.\n                - type (str): The type/category of the service request.\n        \
        \        - status (str): The current ticket status.\n\n        If no tickets are found:\n            - active_tickets\
        \ (list): An empty list.\n\n        On error:\n        - message (str, optional): Error message if the operation fails.\n\
        \nExample:\n    >>> list_active_tickets(\"engineer_123\")\n    >>> Tool Respone:\n        {\n            \"status\"\
        : \"success\",\n            \"active_tickets\": [{\n                \"request_id\": \"123456789\",\n             \
        \   \"title\": \"Washing machine leaking\",\n                \"description\": \"Water leaking from bottom after spin\
        \ cycle\",\n                \"created_on\": \"2025-02-21 22:26:58\",\n                \"type\": \"Mechanical Repair\"\
        ,\n                \"status\": \"open\"\n            }, ...]\n        }"
  list_resolved_tickets:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to fetch all resolved service tickets assigned to a specific engineer.\n\nThis tool connects to Firestore,\
        \ iterates through all service requests and \nretrieves tickets where the `assigned_to` field matches the given \n\
        `engineer_id`. Only **resolved** tickets are included in the result.\n\nArgs:\n    engineer_id (str): The unique identifier\
        \ of the service engineer.\n\nReturns:\n    dict: A dictionary containing:\n        - status (str): Indicates the\
        \ operation result \n            - (\"success\", \"not_found\", or \"error\").\n\n        On success:\n        If\
        \ found. Each ticket contains:\n            - resolved_tickets (list[dict], optional): List of resolved tickets.\n\
        \                - request_id (str): The ticket ID.\n                - title (str): Title of the service request.\n\
        \                - description (str): Description of the issue or request.\n                - created_on (str): Timestamp\
        \ when the ticket was created.\n                - type (str): The type/category of the service request.\n        \
        \        - status (str): The current ticket status.\n\n        If no tickets are found:\n            - resolved_tickets\
        \ (list): An empty list.\n\n        On error:\n        - message (str, optional): Error message if the operation fails.\n\
        \nExample:\n    >>> list_resolved_tickets(\"engineer_123\")\n    >>> Tool Respone:\n        {\n            \"status\"\
        : \"success\",\n            \"resolved_tickets\": [{\n                \"request_id\": \"123456789\",\n           \
        \     \"title\": \"Washing machine leaking\",\n                \"description\": \"Water leaking from bottom after\
        \ spin cycle\",\n                \"created_on\": \"2025-02-21 22:26:58\",\n                \"type\": \"Mechanical\
        \ Repair\",\n                \"status\": \"open\"\n            }, ...]\n        }"
  register_new_appliance_tool:
    type: function
    agents: [register_appliance_agent]
    params:
      description: |-
        Registers a new household appliance to the customer's profile. This tool is
        the final action in the appliance registration workflow, responsible for
        persisting all the collected appliance details into the backend database.

        It ensures that the customer's ownership of the appliance, along with its
        full specifications and warranty information, is accurately recorded for
        future support, maintenance, and service interactions.

        Args:
            category (str): The top-level category of the appliance
            sub_category (str): The sub-category of the appliance
            brand (str): The brand of the appliance
            model_number (str): The specific model number of the appliance.
            serial_number (str): Serial number of the individual appliance unit.
            purchase_date (str): Date the appliance was purchased (YYYY-MM-DD).
            installation_date (str): Date the appliance was installed (YYYY-MM-DD).
            purchased_from (str): Type of vendor where the appliance was purchased
            seller (str): Specific name of the seller or retailer
            tool_context (ToolContext): Provides context for the tool execution..

        Returns:
            dict: Dictionary indicating the success or failure of the registration.
  register_onsite_service_request_tool:
    type: function
    agents: [register_onsite_service_request_agent]
    params:
      description: |-
        Registers a new onsite service request for a customer's appliance in the
        backend database.

        This tool is critical for registering a new onsite service request. It
        collects all necessary details, including appliance identification (via
        serial number), the nature of the request, a detailed description of the
        issue, and the customer's contact and location information. It ensures that
        field service engineers receive comprehensive context to prepare for and
        address the service issue effectively.

        Args:
            customer_id (str): Customer's unique identifier.
            serial_number (str): Serial number of the appliance requiring service.
            request_type (str): Type of request (eg. "Calibration", "Installation")
            issue_description (str): Description of the problem or service needed.
            request_title (str): Title of the service request.
            phone_number (str): Customer's phone number.
            email (str): Customer's email address.
            street (str): Street address for the service location.
            city (str): City for the service location.
            state (str): State/province for the service location.
            zipcode (str): Postal code for the service location.
            tool_context (ToolContext): Provides context for the tool execution.

        Returns:
            dict: Dictionary indicating result of the service request registration.
                - On success:
                    {
                        'status': 'success',
                        'message': 'Service request registered successfully!',
                        'service_request_id': 'ABCXYZ789'
                    }

                - On failure:
                    {
                        'status': 'error',
                        'message': 'Failed to register service request.',
                        'error': 'Reason for failure'
                    }
  remove_skills:
    type: function
    agents: [account_management_agent]
    params:
      description: "Tool to remove specific skills from an engineer's skill set in the database.\n\nThis tool allows deleting\
        \ one or more existing skills from an engineer's \nprofile. It retrieves the current list of skills from the database,\
        \ removes \nonly those specified in the input (if present), and updates the record with \nthe modified skill list.\n\
        \nIf a skill provided for removal does not exist in the engineer's current \nskill set, it will be reported as an\
        \ invalid removal request.\n\nArgs:\n    engineer_id (str): Unique identifier of the engineer whose skills \n    \
        \    need to be modified.\n    skills_to_remove (list): List of skills to remove from the engineer's \n        profile.\n\
        \nReturns:\n    A dictionary containing:\n        - status (str): Indicates the operation result \n            - \"\
        success\", \"not_found\", or \"error\".\n        - message (str): Success message or a brief description of the error\n\
        \n        On success:\n            - removed_skills (list): List of updated skills for the engineer\n            -\
        \ invalid_skills (list): List of skills that were not found and \n              hence not removed.\n\n    >>> Example:\n\
        \        {\n            \"status\": \"success\",\n            \"message\": \"Skills removed for engineer ID ENG123.\"\
        ,\n            \"removed_skills\": [\"Installation\"],\n            \"invalid_skills (not found)\": [\"Cooking Assistance\"\
        ]\n        }\n\nRaises:\n    Exception: If a database connection or query execution error occurs."
  remove_specializations:
    type: function
    agents: [account_management_agent]
    params:
      description: "Tool to remove existing specializations from an engineer's profile.\n\nThis tool removes one or more existing\
        \ specializations from a service \nengineer's profile. The provided specializations are matched against the \nengineer's\
        \ current specializations stored in the database, and any matches \nare removed from their profile.\n\nArgs:\n   \
        \ engineer_id (str): Unique identifier of the engineer whose \n        specializations need to be removed.\n    specializations_to_remove\
        \ (list): List of specializations to remove \n        from the engineer's profile.\n\nReturns:\n    dict: A dictionary\
        \ containing:\n        - status (str): Indicates the operation result \n            (\"success\", \"not_found\", or\
        \ \"error\").\n        - message (str): Success message or a brief description of the error.\n\n        On success:\n\
        \        A dictionary containing:\n            - removed_specializations (list): List of successfully removed \n \
        \             specializations.\n            - not_found_specializations (list): List of provided \n              specializations\
        \ that were not present in the engineer's profile.\n\n>>> Example:\n    {\n        \"status\": \"success\",\n    \
        \    \"message\": \"Specializations removed for engineer ID ENG123.\",\n        \"removed_specializations\": [\"Washing\
        \ Machine\", \"Microwave Oven\"],\n        \"not_found_specializations\": [\"Refrigerator\"]\n    }"
  report_unsafe_working_condition:
    type: function
    agents: [ticket_management_agent]
    params:
      description: "Tool to report unsafe working conditions encountered during service visit.\n\nThis tool allows an engineer\
        \ to record details about unsafe or hazardous \nworking environments observed at a customer's location. The description\
        \ of \nthe unsafe condition is stored in the corresponding service request field.\n\nArgs:\n    customer_id (str):\
        \ The unique ID of the customer.\n    service_request_id (str): ID of the service request being updated.\n    working_condition_description\
        \ (str): Textual description of the unsafe \n        working condition encountered by the engineer.\n\nReturns:\n\
        \    dict: A dictionary containing:\n        - status (str): Indicates the operation result \n            - (\"success\"\
        , \"not_found\", or \"error\").\n        - message (str): A descriptive message summarizing the outcome.\n\nExample:\n\
        \    >>> report_unsafe_working_condition(\"cust1023\", \"req687\", \"Exposed...\")\n    >>> Tool Respone:\n    {\n\
        \        \"status\": \"success\",\n        \"message\": \"Unsafe working conditions reported.\"\n    }"
  retrieve_service_manual_corpora_tool:
    type: function
    agents: [appliance_support_and_troubleshooting_agent]
  update_address:
    type: function
    agents: [account_management_agent]
    params:
      description: "Tool to update the address details of a service engineer in the database.\n\nThis tool updates an engineer's\
        \ address information, including street, city, \ndistrict, state, zip code, and country. It automatically attempts\
        \ to validate \nor correct the district name using the provided postal (PIN) code by calling \nan external postal\
        \ API via the helper function `get_district_from_zip`. If the \nAPI successfully returns a district, it overrides\
        \ the input district before \nupdating the database record.\n\nArgs:\n    engineer_id (str): Id of the engineer whose\
        \ address needs to be updated.\n    street (str): Street name or house address.\n    city (str): City name.\n    district\
        \ (str): District name (will be auto-corrected using zipcode).\n    state (str): State name.\n    zipcode (str): Postal\
        \ or ZIP code of the address.\n    country (str): Country name.\n\nReturns:\n    dict: A dictionary containing:\n\
        \        - status (str): Indicates the operation result \n            (\"success\", \"not_found\", or \"error\").\n\
        \        - message (str): Success message or a brief description of the error.\n\n        On success:\n        - new_address\
        \ (str, optional): The updated address in a formatted \n          string if the operation succeeds.\n\n>>> Example:\n\
        \    {\n        \"status\": \"success\",\n        \"message\": \"Address updated for engineer ID ENG123.\",\n    \
        \    \"new_address\": \"MG Road, Majestic, Bengaluru, Karnataka-560001, India\"\n    }"
  update_customer_appliance_details_tool:
    type: function
    agents: [customer_appliances_agent]
    params:
      description: |-
        Updates specified details for a customer's appliance in the database.

        This tool handles modifications to user-updatable fields of a registered
        appliance. It also performs validation to prevent changes to immutable core
        appliance details.

        Args:
            customer_id (str): Unique identifier of the customer.
            serial_number (str): Serial number of the appliance to update.
            updates (dict): Dictionary of field names and their new values.
                            User-updatable fields include category, sub_category,
                            brand, model_number, serial_number, purchased_from,
                            seller, purchase_date, installation_date.
                            e.g., {'installation_date': '2024-05-01',
                                   'seller': 'Online Retailer Inc.'}
            tool_context (ToolContext): Provides context for the tool execution.

        Returns:
            dict: Dictionary indicating the success or failure of the update.
                - On success: `{
                            'status': 'success',
                            'message': 'Appliance details updated successfully!'
                        }`
                - On failure: `{
                            'status': 'failed',
                            'message': 'Failed to update: <reason>'
                        }`
  update_customer_details_tool:
    type: function
    agents: [update_customer_profile_agent]
    params:
      description: |-
        Updates specific customer details in the Cloud SQL MySQL database.

        This tool dynamically constructs an SQL UPDATE query based on the provided
        'updates' dictionary. It's designed to only update allowed fields, ensuring
        data integrity for customer profiles.

        Args:
            customer_id (str): Customer's unique identifier.
            updates (dict): Dictionary of fields to update and their new values.
                            Keys must correspond to database column names for
                            updatable fields.

        Returns:
            Dict[str, Any]: Dictionary indicating status of the update operation.
  update_service_request_details_tool:
    type: function
    agents: [service_requests_agent]
    params:
      description: |-
        Updates specific details of an existing customer service request.

        This tool allows for modifying information related to a service request,
        such as contact details, request title, description, or customer notes. It
        ensures updates are applied only to authorized fields.

        Args:
            customer_id (str): Customer ID of the user who owns the service request
            request_id (str): Unique request ID of the service request to update.
            updated_data (Dict[str, str]): Dictionary of fields to update and their
                                           new values.

        Returns:
            dict: Dictionary indicating the status of the update operation.
  validate_and_format_address_tool:
    type: function
    agents: [update_customer_profile_agent, register_onsite_service_request_agent]
    params:
      description: |-
        Validate and standardize an address using Google's Address Validation API,
        with additional processing for Indian addresses via Postal Pincode API.

        This tool determines the validity of a given address, extracts its
        standardized components, and suggests a recommended address structure.
        It's particularly useful for ensuring correct address details for customer
        profiles.

        Args:
            address (str): Complete address string to be validated and formatted.

        Returns:
            dict: Dictionary containing the validation result:
                - status (str): Status of the overall operation (success or error)
                - is_valid (bool): True if address passes validation, else False
                - recommended_address (dict): Dictionary with standardized address
                                              components (Street, District, City,
                                              State, Country, Zipcode) if a valid
                                              address can be generated. Returns
                                              None if the address is not valid or
                                              cannot be parsed.
                - 'message' (str, only on 'failed' status): An error message if the
                                              operation failed.

