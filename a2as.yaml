variables:
  GOOGLE_APPLICATION_CREDENTIALS:
    type: env
    params:
      caller: [os.environ]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.environ]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.environ]
  GOOGLE_GENAI_USE_VERTEX_AI:
    type: env
    params:
      caller: [os.environ]
  TROUBLESHOOT_GUIDE_FILE_SEARCH_STORE_NAME:
    type: env
    params:
      caller: [os.getenv]
      path: [engineer_agent.sub_agents.troubleshoot_agent.agent]

files:
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), .env]
  assets/css/customers.css:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  assets/css/engineers.css:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]

networks:
  api.open-meteo.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      caller: [get_weather]
  api.postalpincode.in:
    type: api
    actions: [GET]
    urls: ['/{...}', /pincode/]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://api.postalpincode.in/pincode/{zipcode}
      caller: [get_district_from_zip, validate_and_format_address_tool]
  api.postalpincode.in.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://api.postalpincode.in/pincode/{zip_code}
      caller: [fetch_district_and_state_from_zipcode]
  maps.googleapis.com:
    type: api
    actions: [GET]
    urls: [/maps/api/directions/json]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [get_directions, get_traffic_eta]
  nominatim.openstreetmap.org:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://nominatim.openstreetmap.org/search?q={address}&format=json
      caller: [get_weather]
  www.youtube.com:
    type: api
    actions: [GET]
    urls: [/@bensappliancesandjunk]
    protocols: [https]
    ports: ["443"]
    params:
      links: [url]
  youtu.be:
    type: api
    actions: [GET]
    urls: ['/Hn2pXXF0PEg?si=s4rCspSXkWyfHK5Z']
    protocols: [https]
    ports: ["443"]
    params:
      caller: [st.link_button]
